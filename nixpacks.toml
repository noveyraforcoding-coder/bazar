providers = ["python"]

[phases.setup]
nixPkgs = ["python312", "gcc", "libpq"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --noinput"
]

[start]
cmd = "gunicorn bazarna.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-file -"
